<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>禅心祈福</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#C9A84C;--gold-soft:rgba(201,168,76,0.8);--gold-dim:rgba(201,168,76,0.25);--warm:#F5E6C8;--warm-dim:rgba(245,230,200,0.6);--deep:#0E0B08}
body{font-family:"Noto Serif SC","Songti SC","STSong",serif;background:var(--deep);color:var(--warm);height:100vh;overflow:hidden;user-select:none;position:relative;margin:0 auto;text-align:center;font-size:15px}

/* 背景 */
.layer-bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 100%,rgba(40,28,16,0.8) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 50% 20%,rgba(60,40,20,0.3) 0%,transparent 50%),linear-gradient(180deg,#080604 0%,#0E0B08 30%,#16100A 70%,#0E0B08 100%)}
.ambient-glow{position:fixed;width:400px;height:400px;top:35%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,168,76,0.06) 0%,transparent 70%);animation:ambPulse 4s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes ambPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.dust-layer{position:fixed;inset:0;z-index:2;pointer-events:none}
.dust{position:absolute;border-radius:50%;background:var(--gold);opacity:0;animation:dustFloat linear infinite}
@keyframes dustFloat{0%{opacity:0;transform:translateY(0) translateX(0)}10%{opacity:.3}90%{opacity:.1}100%{opacity:0;transform:translateY(-100vh) translateX(20px)}}

/* 节气/佛诞日提醒横幅 */
.festival-bar{position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;padding:6px 16px;background:linear-gradient(180deg,rgba(201,168,76,0.12),transparent);font-size:12px;letter-spacing:2px;color:var(--gold);opacity:.85;pointer-events:none;transition:opacity .5s}
.festival-bar.hidden{opacity:0}
.festival-bar .fest-icon{margin-right:4px}

/* 主容器 */
.app{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;align-items:center;margin:0 auto;width:100%}

/* 顶部 */
.top-area{flex-shrink:0;text-align:center;padding:24px 0 8px;width:100%}
.title{font-size:26px;font-weight:300;letter-spacing:12px;color:var(--gold);opacity:.95;text-shadow:0 0 30px rgba(201,168,76,0.2)}
.tagline{font-size:12px;letter-spacing:4px;color:var(--warm);opacity:.65;margin-top:4px}
.ornament{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.ornament-line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.ornament-dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.3}

/* 祭坛 */
.altar-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;width:100%;min-height:0;overflow:visible}
.altar-center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.buddha-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.buddha-light{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,0.06) 0%,rgba(201,168,76,0.02) 40%,transparent 70%);animation:bLightPulse 5s ease-in-out infinite;pointer-events:none}
@keyframes bLightPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}

/* 精细佛像SVG */
.buddha-icon{width:80px;height:120px;position:relative;z-index:2;margin-bottom:8px;color:var(--gold);filter:drop-shadow(0 0 20px rgba(201,168,76,0.12))}

/* 香炉 */
.burner-combo{position:relative;display:flex;flex-direction:column;align-items:center}
.sticks-row{display:flex;gap:7px;margin-bottom:-2px;position:relative;z-index:3;height:50px;align-items:flex-end}
.stick{width:2px;height:0;background:linear-gradient(to bottom,#E8A040 0%,#A07840 40%,#6B5030 100%);border-radius:1px;position:relative;transition:height 2s cubic-bezier(.25,.46,.45,.94)}
.stick.lit{height:48px}
.stick .ember{position:absolute;top:-2px;left:-2px;width:6px;height:4px;background:radial-gradient(ellipse,#FF6020 0%,rgba(255,96,32,0.3) 60%,transparent 100%);border-radius:50%;animation:emberF .4s ease-in-out infinite alternate}
@keyframes emberF{0%{opacity:.6;transform:scaleX(.8) scaleY(.9)}100%{opacity:1;transform:scaleX(1.2) scaleY(1.1)}}
.burner{width:64px;height:28px;position:relative;z-index:3;background:linear-gradient(180deg,#5A4030,#3A2520);border-radius:4px 4px 12px 12px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.burner::before{content:'';position:absolute;top:-3px;left:6px;right:6px;height:5px;background:linear-gradient(180deg,#7A5A40,#5A4030);border-radius:3px}
.burner-char{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--gold);opacity:.6}
#smokeCanvas{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:160px;height:280px;pointer-events:none;z-index:4}

/* 供灯环 - 圆弧排列 */
.burner-combo{position:relative}
.lamp-ring{position:relative;left:50%;transform:translateX(-50%);z-index:3;width:200px;height:50px;margin-top:8px;pointer-events:none}
.mini-lamp{width:14px;height:20px;position:absolute;cursor:pointer;transition:all .4s;pointer-events:auto}
.mini-lamp:hover{filter:brightness(1.4);transform:scale(1.15)}
.mini-lamp .flame{width:6px;height:8px;margin:0 auto;background:radial-gradient(ellipse at bottom,#FFA940,#FF6B35 50%,transparent 100%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;position:relative;z-index:1;animation:mFlame .7s ease-in-out infinite alternate}
@keyframes mFlame{0%{transform:scaleX(.85) scaleY(1.05) translateX(-.3px)}100%{transform:scaleX(1.05) scaleY(.9) translateX(.3px)}}
.mini-lamp .glow{position:absolute;top:-6px;left:-8px;width:30px;height:30px;background:radial-gradient(circle,rgba(255,169,64,0.25) 0%,transparent 70%);border-radius:50%;animation:glowBreathe 2.5s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.mini-lamp .base{width:8px;height:10px;margin:-1px auto 0;background:linear-gradient(180deg,#B89860,#7A6040);border-radius:1px 1px 2px 2px;position:relative;z-index:1}
.mini-lamp.empty{opacity:.35}.mini-lamp.empty .flame{background:rgba(201,168,76,0.2);animation:none}.mini-lamp.empty .glow{display:none}
/* 新灯出现动画 */
.mini-lamp.appear{animation:lampAppear .6s ease-out}
@keyframes lampAppear{0%{opacity:0;transform:scale(0) translateY(10px)}60%{opacity:1;transform:scale(1.2) translateY(-2px)}100%{transform:scale(1) translateY(0)}}

/* 底部 */
.bottom-area{flex-shrink:0;width:100%;padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.main-actions{display:flex;gap:10px;justify-content:center;align-items:center}
.btn-incense{padding:8px 28px;border-radius:20px;background:linear-gradient(135deg,rgba(201,168,76,0.2),rgba(201,168,76,0.08));border:1px solid rgba(201,168,76,0.4);color:var(--gold);font-size:15px;font-family:inherit;letter-spacing:4px;cursor:pointer;transition:all .4s;position:relative;overflow:hidden}
.btn-incense:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,0.15);transform:translateY(-1px)}
.btn-incense:active{transform:scale(.97)}.btn-incense:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-sub{padding:7px 18px;border-radius:16px;background:transparent;border:1px solid rgba(201,168,76,0.35);color:var(--warm);opacity:.85;font-size:13px;font-family:inherit;letter-spacing:2px;cursor:pointer;transition:all .3s}
.btn-sub:hover{border-color:rgba(201,168,76,0.5);color:var(--gold);opacity:1}

/* 香型 */
.incense-select{display:flex;gap:16px;align-items:center}
.incense-opt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .3s;padding:4px 8px;border-radius:8px}
.incense-opt:hover{background:rgba(201,168,76,0.05)}.incense-opt.active{background:rgba(201,168,76,0.08)}
.incense-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(201,168,76,0.5);transition:all .3s;background:rgba(201,168,76,0.1)}
.incense-opt.active .incense-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,0.4)}
.incense-opt.sandal .incense-dot{border-color:#A08060}.incense-opt.sandal.active .incense-dot{background:#A08060;box-shadow:0 0 8px rgba(160,128,96,0.4)}
.incense-opt.aloes .incense-dot{border-color:#8B6B4A}.incense-opt.aloes.active .incense-dot{background:#8B6B4A;box-shadow:0 0 8px rgba(139,107,74,0.4)}
.incense-opt.lily .incense-dot{border-color:#C8BFA8}.incense-opt.lily.active .incense-dot{background:#C8BFA8;box-shadow:0 0 8px rgba(200,191,168,0.4)}
.incense-name{font-size:12px;color:var(--warm);opacity:.8;transition:all .3s;letter-spacing:1px}
.incense-opt.active .incense-name{color:var(--gold);opacity:.9}

/* 敲钟按钮 */
.btn-bell{height:32px;border-radius:16px;padding:0 12px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-family:inherit;gap:2px}
.btn-bell:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,0.2);transform:scale(1.05)}
.btn-bell:active{transform:scale(.9)}

/* 音乐控制 */
.music-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
.music-toggle{width:28px;height:28px;border-radius:50%;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:12px;flex-shrink:0;position:relative}
.music-ring{position:absolute;inset:0;width:100%;height:100%}
.music-prog{transition:stroke-dashoffset .3s ease;filter:drop-shadow(0 0 3px rgba(201,168,76,0.6))}
.music-icon{position:relative;z-index:1}
.music-toggle:hover{border-color:var(--gold);box-shadow:0 0 10px rgba(201,168,76,0.15)}
.music-toggle.playing{border-color:var(--gold);background:rgba(201,168,76,0.12);animation:musicPulse 2s ease-in-out infinite}
@keyframes musicPulse{0%,100%{box-shadow:0 0 0 rgba(201,168,76,0)}50%{box-shadow:0 0 8px rgba(201,168,76,0.2)}}
.music-tracks{display:flex;gap:4px}
.music-track{padding:3px 10px;border-radius:12px;font-size:11px;color:var(--warm);opacity:.5;cursor:pointer;transition:all .3s;letter-spacing:1px;border:1px solid transparent;font-family:inherit;background:transparent}
.music-track:hover{opacity:.6}
.music-track.active{opacity:1;color:var(--gold);border-color:rgba(201,168,76,0.25);background:rgba(201,168,76,0.06)}
.music-vol{width:50px;height:3px;-webkit-appearance:none;appearance:none;background:rgba(201,168,76,0.15);border-radius:2px;outline:none;cursor:pointer}
.music-vol::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--gold);opacity:.6;cursor:pointer}
.music-vol::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--gold);border:none;cursor:pointer}

/* 信息栏 */
.info-bar{display:flex;gap:20px;justify-content:center;align-items:center;padding:4px 0 0}
.info-item{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--warm);opacity:.7;letter-spacing:1px;cursor:default}
.info-item.clickable{cursor:pointer;transition:opacity .3s}
.info-item.clickable:hover{opacity:.7}
.info-num{color:var(--gold);font-size:14px;opacity:.9}
.info-sep{width:1px;height:10px;background:rgba(201,168,76,0.1)}

/* 弹窗 */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px)}
.modal-bg.show{display:flex}
.modal-card{width:100%;max-width:300px;background:linear-gradient(180deg,#1C1610,#14100C);border:1px solid rgba(201,168,76,0.15);border-radius:16px;padding:24px 20px;animation:modalIn .3s ease}
@keyframes modalIn{from{transform:translateY(15px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-heading{text-align:center;font-size:17px;color:var(--gold);letter-spacing:6px;margin-bottom:18px;font-weight:300}
.modal-btns{display:flex;gap:10px}
.modal-btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;letter-spacing:2px;border:none;transition:all .3s}
.m-cancel{background:rgba(255,255,255,0.05);color:var(--warm)}
.m-ok{background:linear-gradient(135deg,rgba(201,168,76,0.2),rgba(201,168,76,0.08));color:var(--gold);border:1px solid rgba(201,168,76,0.25)}
.wish-types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.wish-type-btn{padding:8px 2px;background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.12);border-radius:8px;text-align:center;font-size:13px;color:var(--warm);cursor:pointer;transition:all .3s;font-family:inherit}
.wish-type-btn.sel{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.1)}
.wish-textarea{width:100%;padding:10px;background:rgba(0,0,0,.4);border:1px solid rgba(201,168,76,0.15);border-radius:8px;color:var(--warm);font-size:14px;font-family:inherit;resize:none;outline:none;margin-bottom:14px}
.wish-textarea::placeholder{color:rgba(245,230,200,0.3)}.wish-textarea:focus{border-color:rgba(201,168,76,0.3)}
.lamp-modal-buddhas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.buddha-card{padding:10px 4px;background:rgba(201,168,76,0.03);border:1px solid rgba(201,168,76,0.08);border-radius:10px;text-align:center;cursor:pointer;transition:all .3s;font-family:inherit}
.buddha-card.sel{border-color:var(--gold);background:rgba(201,168,76,0.1)}
.buddha-card-name{font-size:14px;color:var(--gold);margin-bottom:2px}
.buddha-card-desc{font-size:11px;color:var(--warm);opacity:.55}
.wish-wall-list{max-height:50vh;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.wish-wall-list::-webkit-scrollbar{display:none}
.wall-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px;border:1px solid rgba(201,168,76,0.06)}
.wall-type{font-size:11px;color:var(--gold);padding:2px 6px;background:rgba(201,168,76,0.1);border-radius:4px;flex-shrink:0}
.wall-text{font-size:13px;color:var(--warm);flex:1}
.wall-date{font-size:11px;color:rgba(245,230,200,0.35);flex-shrink:0}

/* 分享弹窗 */
.share-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.share-item{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(0,0,0,.3);border:1px solid rgba(201,168,76,0.08);border-radius:10px;cursor:pointer;transition:all .3s;font-family:inherit}
.share-item:hover{border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.05)}
.share-icon{font-size:20px;width:32px;text-align:center}
.share-label{font-size:14px;color:var(--warm)}
.share-desc{font-size:11px;color:var(--warm);opacity:.5;margin-top:2px}

/* 节气弹窗 */
.fest-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid rgba(201,168,76,0.1)}
.fest-tab{flex:1;padding:8px 0;text-align:center;font-size:13px;color:var(--warm);opacity:.6;cursor:pointer;transition:all .3s;letter-spacing:2px;border-bottom:2px solid transparent}
.fest-tab.active{color:var(--gold);opacity:1;border-bottom-color:var(--gold)}
.fest-list{max-height:50vh;overflow-y:auto;scrollbar-width:none}
.fest-list::-webkit-scrollbar{display:none}
.fest-group{margin-bottom:12px}
.fest-group-title{font-size:12px;color:var(--gold);opacity:.65;letter-spacing:3px;padding:6px 0 4px;border-bottom:1px solid rgba(201,168,76,0.08);margin-bottom:8px}
.fest-row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;background:rgba(201,168,76,0.03);border:1px solid rgba(201,168,76,0.06);border-radius:10px;transition:all .3s}
.fest-row:hover{border-color:rgba(201,168,76,0.15);background:rgba(201,168,76,0.06)}
.fest-row-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.fest-row-body{flex:1;min-width:0}
.fest-row-name{font-size:15px;color:var(--gold);letter-spacing:1px;margin-bottom:2px}
.fest-row-desc{font-size:12px;color:var(--warm);opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fest-row-date{font-size:12px;color:var(--warm);opacity:.4;flex-shrink:0;letter-spacing:1px}
.fest-row.is-today{border-color:rgba(201,168,76,0.25);background:rgba(201,168,76,0.08)}
.fest-row.is-today .fest-row-name{opacity:1}
.fest-row.is-today::after{content:'今日';font-size:8px;color:var(--gold);opacity:.6;padding:1px 5px;border:1px solid rgba(201,168,76,0.2);border-radius:4px;margin-left:auto;flex-shrink:0}

.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%) translateY(-10px);padding:8px 22px;background:rgba(20,16,12,.95);border:1px solid rgba(201,168,76,0.3);border-radius:20px;color:var(--gold);font-size:13px;letter-spacing:1px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lotus-fx{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:90;opacity:0;transition:opacity .3s}
.lotus-fx.show{opacity:1}
.lotus-fx svg{width:140px;height:140px;animation:lotusAnim 1.3s ease-out forwards}
@keyframes lotusAnim{0%{transform:scale(0) rotate(-30deg);opacity:0}40%{transform:scale(1.1) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:0}}

/* ===== 手机端适配 ===== */
@media screen and (max-width:430px){
  /* 安全区 */
  .top-area{padding-top:max(24px,env(safe-area-inset-top))}
  .bottom-area{padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .festival-bar{padding-top:max(6px,env(safe-area-inset-top));font-size:15px}
  /* 整体紧凑 */
  .top-area{padding-bottom:4px}
  .title{font-size:30px;letter-spacing:8px}
  .tagline{font-size:15px;margin-top:2px}
  .ornament{margin-top:4px}
  /* 佛像/香炉绝对定位，可重叠 */
  .altar-center{width:100%;height:480px}
  .buddha-wrap{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2}
  .burner-combo{position:absolute;top:234px;left:50%;transform:translateX(-50%);z-index:3;margin-top:0}
  /* 佛像 */
  .buddha-icon{width:270px;height:405px;margin-bottom:8px}
  .buddha-light{width:720px;height:720px}
  /* 香炉 */
  .burner{width:70px;height:28px}
  .burner::before{left:6px;right:6px;height:5px;top:-2px}
  .burner-char{font-size:15px}
  .stick.lit{height:50px}
  .sticks-row{height:52px;gap:8px}
  #smokeCanvas{width:150px;height:280px}
  /* 供灯环 */
  .lamp-ring{width:220px;height:55px;margin-top:10px}
  .mini-lamp{width:14px;height:22px}
  .mini-lamp .flame{width:7px;height:9px}
  .mini-lamp .base{width:9px;height:10px}
  .mini-lamp .glow{top:-6px;left:-7px;width:28px;height:28px}
  /* 香型间距 */
  .incense-select{gap:12px}
  .incense-name{font-size:16px}
  .incense-dot{width:9px;height:9px}
  /* 按钮行紧凑 */
  .main-actions{gap:5px;flex-wrap:nowrap;justify-content:center}
  .btn-incense{padding:8px 14px;font-size:15px;letter-spacing:2px;white-space:nowrap;flex-shrink:0}
  .btn-sub{padding:8px 10px;font-size:13px;letter-spacing:1px;white-space:nowrap;flex-shrink:0}
  .btn-bell{padding:0 8px;height:34px;gap:1px;flex-shrink:0}
  .btn-bell span:last-child{font-size:11px}
  /* 底部信息栏 */
  .info-bar{gap:14px}

<script>
const SK='zenBlessing';
function gd(){try{return JSON.parse(localStorage.getItem(SK))||{}}catch{return{}}}
function sd(d){localStorage.setItem(SK,JSON.stringify({...gd(),...d}))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

// ===== Web Audio 音效 =====
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}

// 敲钟音效 - 真实寺庙钟声
let bellAudio=null;
function ringBell(){
  if(!bellAudio){bellAudio=new Audio('audio/bell.wav');bellAudio.volume=0.8}
  bellAudio.currentTime=0;bellAudio.play().catch(()=>{});
  toast('晨钟暮鼓 · 消除烦恼');
}

// 念经音效 - 低频嗡鸣
function chantSound(){
  const ctx=getAudio();const t=ctx.currentTime;
  const freqs=[131,196,262]; // C3 G3 C4 Om
  freqs.forEach((f,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(f,t);
    // 缓慢起声
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.08-i*0.015,t+0.8);
    gain.gain.linearRampToValueAtTime(0.06-i*0.01,t+2.5);
    gain.gain.exponentialRampToValueAtTime(0.001,t+4);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(t);osc.stop(t+4);
  });
}

// 供灯音效 - 清脆叮
function lampSound(){
  const ctx=getAudio();const t=ctx.currentTime;
  const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(880,t); // A5
  gain.gain.setValueAtTime(0.1,t);gain.gain.exponentialRampToValueAtTime(0.001,t+1);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+1);
}

// 签到音效
function checkinSound(){
  const ctx=getAudio();const t=ctx.currentTime;
  [660,880].forEach((f,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(f,t+i*0.15);
    gain.gain.setValueAtTime(0.08,t+i*0.15);gain.gain.exponentialRampToValueAtTime(0.001,t+i*0.15+0.8);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(t+i*0.15);osc.stop(t+i*0.15+0.8);
  });
}

function renderSticks(){

// ===== 烟雾 =====
const cvs=document.getElementById('smokeCanvas'),ctx=cvs.getContext('2d');
let particles=[],animId=null;

class P{constructor(x,y,c){this.x=x+(Math.random()-.5)*14;this.y=y;this.vx=(Math.random()-.5)*.2;this.vy=-(Math.random()*.5+.15);this.r=Math.random()*2.5+1;this.a=.25+Math.random()*.15;this.c=c;this.life=1;this.dk=.0015+Math.random()*.002}up(){this.x+=this.vx;this.y+=this.vy;this.vx+=(Math.random()-.5)*.03;this.r+=.02;this.life-=this.dk;this.a*=.998}draw(c){c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fillStyle=this.c.replace('rgb','rgba').replace(')',`,${this.a*this.life})`);c.fill()}}
function startSmoke(){if(!animId)drawSmoke()}
function drawSmoke(){const cw=cvs.width,ch=cvs.height;ctx.clearRect(0,0,cw,ch);const d=gd();const act=(d.activeIncense||[]).filter(i=>Date.now()-i.st<i.dur);const cols={sandalwood:'rgb(180,160,130)',aloeswood:'rgb(140,120,90)',lily:'rgb(200,190,170)'};const cvsRect=cvs.getBoundingClientRect();const embers=document.querySelectorAll('.stick .ember');if(act.length>0)act.forEach((inc,i)=>{const c=cols[inc.type]||cols.sandalwood;const off=(i-(act.length-1)/2)*9;if(embers[i]){const eR=embers[i].getBoundingClientRect();const px=eR.left+eR.width/2-cvsRect.left;const py=eR.top+eR.height/2-cvsRect.top;if(Math.random()<.18)particles.push(new P(px,py,c))}else if(Math.random()<.18){particles.push(new P(cw/2+off,ch-5,c))}});particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.up();p.draw(ctx)});if(act.length>0||particles.length>0)animId=requestAnimationFrame(drawSmoke);else animId=null}

// ===== 供灯环（圆弧排列+呼吸+出现动画） =====
function renderLampRing(){
  const d=gd();const lamps=d.lamps||{};
  const ring=document.getElementById('lampRing');ring.innerHTML='';
  let total=0;Object.values(lamps).forEach(n=>total+=n);
  const show=Math.min(total,9);
  const count=Math.max(show,5);
  // 圆弧分布
  const spread=160; // 横向展开px
  for(let i=0;i<count;i++){
    const l=document.createElement('div');l.className='mini-lamp'+(i<show?'':' empty');
    if(i===show-1&&show>0)l.classList.add('appear');
    // 计算位置 - 抛物线弧
    const t=count>1?i/(count-1):0.5;
    const x=(t-0.5)*spread;
    const y=-Math.pow(t-0.5,2)*30; // 弧形上凸
    l.style.left=`calc(50% + ${x}px - 7px)`;
    l.style.bottom=`${20-y}px`;
    l.style.animationDelay=(i*0.15)+'s';
    l.innerHTML='<div class="glow"></div><div class="flame"></div><div class="base"></div>';
    ring.appendChild(l);
  }
}

function getFestivalToday(){
  const now=new Date();const m=now.getMonth()+1;const d=now.getDate();
  // 检查佛诞日
  const bd=buddhaDays.find(f=>f.m===m&&f.d===d);
  if(bd)return{type:'buddha',...bd};
  // 检查节气（±1天）
  const st=solarTerms.find(f=>f.m===m&&Math.abs(f.d-d)<=1);
  if(st)return{type:'solar',...st};
  return null;
}

}

// ===== 背景音乐系统 =====
const musicTracks={
  heart:{name:'心经',desc:'观自在菩萨，照见五蕴皆空'},
  compassion:{name:'大悲咒',desc:'千手千眼，大悲心陀罗尼'},
  mantra:{name:'六字明咒',desc:'唵嘛呢叭咪吽'}
};
let musicPlaying=false, currentTrack='heart', audioEl=null;

// 音频文件路径映射（加v参数防浏览器缓存）
const audioFiles={
  heart:'audio/heart_loop.wav?v=3',
  compassion:'audio/compassion_loop.wav?v=3',
  mantra:'audio/mantra_loop.wav?v=3'
};

// 页面加载时预创建Audio对象，常驻缓存
const audioPool={};
Object.keys(audioFiles).forEach(k=>{
  const a=new Audio();a.preload='auto';a.loop=true;a.src=audioFiles[k];
  audioPool[k]=a;
});

function startMusic(){
  if(musicPlaying)return;
  const ctx=getAudio();
  if(ctx.state==='suspended')ctx.resume();

  const progCircle=document.querySelector('.music-prog');
  const circumference=2*Math.PI*16; // ≈100.53

  // 复用已缓存的Audio对象
  audioEl=audioPool[currentTrack];
  audioEl.currentTime=0;
  audioEl.volume=document.getElementById('musicVol').value/100;
  musicPlaying=true;
  document.getElementById('musicToggle').classList.add('playing');
  document.querySelector('.music-icon').innerHTML='&#9646;&#9646;';
  const d=gd();d.musicOn=true;d.musicTrack=currentTrack;sd(d);

  // 监听缓存进度，更新圆环
  function onProgress(){
    if(audioEl.buffered.length>0){
      const buf=audioEl.buffered.end(audioEl.buffered.length-1);
      const pct=buf/audioEl.duration;
      if(progCircle)progCircle.style.strokeDashoffset=circumference*(1-pct);
    }
  }
  audioEl.addEventListener('progress',onProgress);

  audioEl.addEventListener('canplaythrough',function onReady(){
    audioEl.removeEventListener('canplaythrough',onReady);
    audioEl.removeEventListener('progress',onProgress);
    if(progCircle)progCircle.style.strokeDashoffset='0';
    if(musicPlaying)audioEl.play().catch(()=>{});
  },{once:true});

  // 已缓存过则直接播放
  if(audioEl.readyState>=4){
    audioEl.removeEventListener('progress',onProgress);
    if(progCircle)progCircle.style.strokeDashoffset='0';
    audioEl.play().catch(()=>{});
  }else{
    audioEl.load();
  }
}

function stopMusic(){
  if(!musicPlaying)return;
  if(audioEl){audioEl.pause()}
  musicPlaying=false;
  document.getElementById('musicToggle').classList.remove('playing');
  document.querySelector('.music-icon').innerHTML='&#9654;';
  // 重置圆环进度
  const progCircle=document.querySelector('.music-prog');
  const circumference=2*Math.PI*16;
  if(progCircle)progCircle.style.strokeDashoffset=circumference;
  const d=gd();d.musicOn=false;sd(d);
}

function toggleMusic(){
  if(musicPlaying)stopMusic();else startMusic();
}

function selectTrack(track){
  currentTrack=track;
  document.querySelectorAll('.music-track').forEach(t=>t.classList.toggle('active',t.dataset.track===track));
  if(musicPlaying){stopMusic();startMusic()}
  const d=gd();d.musicTrack=track;sd(d);
}

function setMusicVol(v){
  if(audioEl)audioEl.volume=v/100;
  const d=gd();d.musicVol=v;sd(d);
}

function restoreMusic(){
  const d=gd();
  if(d.musicTrack){
    currentTrack=d.musicTrack;
    document.querySelectorAll('.music-track').forEach(t=>t.classList.toggle('active',t.dataset.track===d.musicTrack));
  }
  if(d.musicVol)document.getElementById('musicVol').value=d.musicVol;
}

function initDust(){const l=document.getElementById('dustLayer');const count=window.innerWidth>768?16:8;for(let i=0;i<count;i++){const d=document.createElement('div');d.className='dust';d.style.left=Math.random()*100+'%';d.style.top=(60+Math.random()*40)+'%';d.style.width=d.style.height=(0.5+Math.random()*1.5)+'px';d.style.animationDuration=(8+Math.random()*12)+'s';d.style.animationDelay=Math.random()*10+'s';l.appendChild(d)}}

// 关闭弹窗
['wishModal','lampModal','wallModal','shareModal','festModal'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target===e.currentTarget)e.target.classList.remove('show')});
});

// ===== 初始化 =====
initWishTypes();initLampBuddhas();initDust();initFestivalBar();restoreMusic();
renderSticks();renderLampRing();updateInfo();
const _d=gd();
if((_d.activeIncense||[]).filter(i=>Date.now()-i.st<i.dur).length>0)startSmoke();
</script>
