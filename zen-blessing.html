<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>禅心祈福</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap');

/* ===== ★ 手机端适配 (≤430px) ★ — 基准布局，禁止修改 ★ ===== */
@media screen and (max-width:430px){
  /* 安全区 */
  .top-area{padding-top:max(24px,env(safe-area-inset-top))}
  .bottom-area{padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .festival-bar{padding-top:max(6px,env(safe-area-inset-top));font-size:15px}
  /* 整体紧凑 */
  .top-area{padding-bottom:4px}
  .title{font-size:30px;letter-spacing:8px}
  .tagline{font-size:15px;margin-top:2px}
  .ornament{margin-top:4px}
  /* 佛像/香炉绝对定位，可重叠 */
  .altar-center{width:100%;height:480px}
  .buddha-wrap{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2}
  .burner-combo{position:absolute;top:234px;left:50%;transform:translateX(-50%);z-index:3;margin-top:0}
  /* 佛像 */
  .buddha-icon{width:270px;height:405px;margin-bottom:8px}
  .buddha-light{width:720px;height:720px}
  /* 香炉 */
  .burner{width:70px;height:28px}
  .burner::before{left:6px;right:6px;height:5px;top:-2px}
  .burner-char{font-size:15px}
  .stick.lit{height:50px}
  .sticks-row{height:52px;gap:8px}
  #smokeCanvas{width:150px;height:280px}
  /* 供灯环 */
  .lamp-ring{width:220px;height:55px;margin-top:10px}
  .mini-lamp{width:14px;height:22px}
  .mini-lamp .flame{width:7px;height:9px}
  .mini-lamp .base{width:9px;height:10px}
  .mini-lamp .glow{top:-6px;left:-7px;width:28px;height:28px}
  /* 香型间距 */
  .incense-select{gap:12px}
  .incense-name{font-size:16px}
  .incense-dot{width:9px;height:9px}
  /* 按钮行紧凑 */
  .main-actions{gap:5px;flex-wrap:nowrap;justify-content:center}
  .btn-incense{padding:8px 14px;font-size:15px;letter-spacing:2px;white-space:nowrap;flex-shrink:0}
  .btn-sub{padding:8px 10px;font-size:13px;letter-spacing:1px;white-space:nowrap;flex-shrink:0}
  .btn-bell{padding:0 8px;height:34px;gap:1px;flex-shrink:0}
  .btn-bell span:last-child{font-size:11px}
  /* 底部信息栏 */
  .info-bar{gap:14px}
  .info-item{font-size:15px;gap:3px}
  .info-num{font-size:17px}
  /* 弹窗内文字 */
  .modal-heading{font-size:20px;letter-spacing:4px}
  .modal-btn{font-size:16px}
  .wish-type-btn{font-size:15px}
  .wish-textarea{font-size:16px}
  .buddha-card-name{font-size:16px}
  .buddha-card-desc{font-size:13px}
  .wall-type{font-size:14px}
  .wall-text{font-size:15px}
  .wall-date{font-size:13px}
  .fest-tab{font-size:16px}
  .fest-group-title{font-size:14px}
  .fest-row-name{font-size:18px}
  .fest-row-desc{font-size:14px}
  .fest-row-date{font-size:14px}
  .share-label{font-size:16px}
  .share-desc{font-size:13px}
  .toast{font-size:15px}
  .music-track{font-size:13px}
  .music-toggle{width:36px;height:36px;font-size:16px}
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#C9A84C;--gold-soft:rgba(201,168,76,0.8);--gold-dim:rgba(201,168,76,0.25);--warm:#F5E6C8;--warm-dim:rgba(245,230,200,0.6);--deep:#0E0B08}
body{font-family:"Noto Serif SC","Songti SC","STSong",serif;background:var(--deep);color:var(--warm);height:100vh;overflow:hidden;user-select:none;position:relative;margin:0 auto;text-align:center;font-size:15px}

/* 背景 */
.layer-bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% 100%,rgba(40,28,16,0.8) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 50% 20%,rgba(60,40,20,0.3) 0%,transparent 50%),linear-gradient(180deg,#080604 0%,#0E0B08 30%,#16100A 70%,#0E0B08 100%)}
.ambient-glow{position:fixed;width:400px;height:400px;top:35%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(201,168,76,0.06) 0%,transparent 70%);animation:ambPulse 4s ease-in-out infinite;pointer-events:none;z-index:1}
@keyframes ambPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
.dust-layer{position:fixed;inset:0;z-index:2;pointer-events:none}
.dust{position:absolute;border-radius:50%;background:var(--gold);opacity:0;animation:dustFloat linear infinite}
@keyframes dustFloat{0%{opacity:0;transform:translateY(0) translateX(0)}10%{opacity:.3}90%{opacity:.1}100%{opacity:0;transform:translateY(-100vh) translateX(20px)}}

/* 节气/佛诞日提醒横幅 */
.festival-bar{position:fixed;top:0;left:0;right:0;z-index:50;text-align:center;padding:6px 16px;background:linear-gradient(180deg,rgba(201,168,76,0.12),transparent);font-size:12px;letter-spacing:2px;color:var(--gold);opacity:.85;pointer-events:none;transition:opacity .5s}
.festival-bar.hidden{opacity:0}
.festival-bar .fest-icon{margin-right:4px}

/* 主容器 */
.app{position:relative;z-index:5;height:100vh;display:flex;flex-direction:column;align-items:center;margin:0 auto;width:100%}

/* 顶部 */
.top-area{flex-shrink:0;text-align:center;padding:24px 0 8px;width:100%}
.title{font-size:26px;font-weight:300;letter-spacing:12px;color:var(--gold);opacity:.95;text-shadow:0 0 30px rgba(201,168,76,0.2)}
.tagline{font-size:12px;letter-spacing:4px;color:var(--warm);opacity:.65;margin-top:4px}
.ornament{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.ornament-line{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.ornament-dot{width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.3}

/* 祭坛 */
.altar-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;width:100%;min-height:0;overflow:visible}
.altar-center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.buddha-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.buddha-light{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,0.06) 0%,rgba(201,168,76,0.02) 40%,transparent 70%);animation:bLightPulse 5s ease-in-out infinite;pointer-events:none}
@keyframes bLightPulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}

/* 精细佛像SVG */
.buddha-icon{width:80px;height:120px;position:relative;z-index:2;margin-bottom:8px;color:var(--gold);filter:drop-shadow(0 0 20px rgba(201,168,76,0.12))}

/* 香炉 */
.burner-combo{position:relative;display:flex;flex-direction:column;align-items:center}
.sticks-row{display:flex;gap:7px;margin-bottom:-2px;position:relative;z-index:3;height:50px;align-items:flex-end}
.stick{width:2px;height:0;background:linear-gradient(to bottom,#E8A040 0%,#A07840 40%,#6B5030 100%);border-radius:1px;position:relative;transition:height 2s cubic-bezier(.25,.46,.45,.94)}
.stick.lit{height:48px}
.stick .ember{position:absolute;top:-2px;left:-2px;width:6px;height:4px;background:radial-gradient(ellipse,#FF6020 0%,rgba(255,96,32,0.3) 60%,transparent 100%);border-radius:50%;animation:emberF .4s ease-in-out infinite alternate}
@keyframes emberF{0%{opacity:.6;transform:scaleX(.8) scaleY(.9)}100%{opacity:1;transform:scaleX(1.2) scaleY(1.1)}}
.burner{width:64px;height:28px;position:relative;z-index:3;background:linear-gradient(180deg,#5A4030,#3A2520);border-radius:4px 4px 12px 12px;box-shadow:0 4px 12px rgba(0,0,0,.6)}
.burner::before{content:'';position:absolute;top:-3px;left:6px;right:6px;height:5px;background:linear-gradient(180deg,#7A5A40,#5A4030);border-radius:3px}
.burner-char{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:var(--gold);opacity:.6}
#smokeCanvas{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:160px;height:280px;pointer-events:none;z-index:4}

/* 供灯环 - 圆弧排列 */
.burner-combo{position:relative}
.lamp-ring{position:relative;left:50%;transform:translateX(-50%);z-index:3;width:200px;height:50px;margin-top:8px;pointer-events:none}
.mini-lamp{width:14px;height:20px;position:absolute;cursor:pointer;transition:all .4s;pointer-events:auto}
.mini-lamp:hover{filter:brightness(1.4);transform:scale(1.15)}
.mini-lamp .flame{width:6px;height:8px;margin:0 auto;background:radial-gradient(ellipse at bottom,#FFA940,#FF6B35 50%,transparent 100%);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;position:relative;z-index:1;animation:mFlame .7s ease-in-out infinite alternate}
@keyframes mFlame{0%{transform:scaleX(.85) scaleY(1.05) translateX(-.3px)}100%{transform:scaleX(1.05) scaleY(.9) translateX(.3px)}}
.mini-lamp .glow{position:absolute;top:-6px;left:-8px;width:30px;height:30px;background:radial-gradient(circle,rgba(255,169,64,0.25) 0%,transparent 70%);border-radius:50%;animation:glowBreathe 2.5s ease-in-out infinite}
@keyframes glowBreathe{0%,100%{opacity:.4;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
.mini-lamp .base{width:8px;height:10px;margin:-1px auto 0;background:linear-gradient(180deg,#B89860,#7A6040);border-radius:1px 1px 2px 2px;position:relative;z-index:1}
.mini-lamp.empty{opacity:.35}.mini-lamp.empty .flame{background:rgba(201,168,76,0.2);animation:none}.mini-lamp.empty .glow{display:none}
/* 新灯出现动画 */
.mini-lamp.appear{animation:lampAppear .6s ease-out}
@keyframes lampAppear{0%{opacity:0;transform:scale(0) translateY(10px)}60%{opacity:1;transform:scale(1.2) translateY(-2px)}100%{transform:scale(1) translateY(0)}}

/* 底部 */
.bottom-area{flex-shrink:0;width:100%;padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.main-actions{display:flex;gap:10px;justify-content:center;align-items:center}
.btn-incense{padding:8px 28px;border-radius:20px;background:linear-gradient(135deg,rgba(201,168,76,0.2),rgba(201,168,76,0.08));border:1px solid rgba(201,168,76,0.4);color:var(--gold);font-size:15px;font-family:inherit;letter-spacing:4px;cursor:pointer;transition:all .4s;position:relative;overflow:hidden}
.btn-incense:hover{border-color:var(--gold);box-shadow:0 0 20px rgba(201,168,76,0.15);transform:translateY(-1px)}
.btn-incense:active{transform:scale(.97)}.btn-incense:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn-sub{padding:7px 18px;border-radius:16px;background:transparent;border:1px solid rgba(201,168,76,0.35);color:var(--warm);opacity:.85;font-size:13px;font-family:inherit;letter-spacing:2px;cursor:pointer;transition:all .3s}
.btn-sub:hover{border-color:rgba(201,168,76,0.5);color:var(--gold);opacity:1}

/* 香型 */
.incense-select{display:flex;gap:16px;align-items:center}
.incense-opt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:all .3s;padding:4px 8px;border-radius:8px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:auto;user-select:auto;background:none;border:none;font-size:inherit;color:inherit;font-family:inherit}
.incense-opt:hover{background:rgba(201,168,76,0.05)}.incense-opt.active{background:rgba(201,168,76,0.08)}
.incense-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(201,168,76,0.5);transition:all .3s;background:rgba(201,168,76,0.1)}
.incense-opt.active .incense-dot{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,0.4)}
.incense-opt.sandal .incense-dot{border-color:#A08060}.incense-opt.sandal.active .incense-dot{background:#A08060;box-shadow:0 0 8px rgba(160,128,96,0.4)}
.incense-opt.aloes .incense-dot{border-color:#8B6B4A}.incense-opt.aloes.active .incense-dot{background:#8B6B4A;box-shadow:0 0 8px rgba(139,107,74,0.4)}
.incense-opt.lily .incense-dot{border-color:#C8BFA8}.incense-opt.lily.active .incense-dot{background:#C8BFA8;box-shadow:0 0 8px rgba(200,191,168,0.4)}
.incense-name{font-size:12px;color:var(--warm);opacity:.8;transition:all .3s;letter-spacing:1px}
.incense-opt.active .incense-name{color:var(--gold);opacity:.9}

/* 敲钟按钮 */
.btn-bell{height:32px;border-radius:16px;padding:0 12px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-family:inherit;gap:2px}
.btn-bell:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(201,168,76,0.2);transform:scale(1.05)}
.btn-bell:active{transform:scale(.9)}

/* 音乐控制 */
.music-bar{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:2px}
.music-toggle{width:28px;height:28px;border-radius:50%;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.2);color:var(--gold);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:12px;flex-shrink:0;position:relative}
.music-ring{position:absolute;inset:0;width:100%;height:100%}
.music-prog{transition:stroke-dashoffset .3s ease;filter:drop-shadow(0 0 3px rgba(201,168,76,0.6))}
.music-icon{position:relative;z-index:1}
.music-toggle:hover{border-color:var(--gold);box-shadow:0 0 10px rgba(201,168,76,0.15)}
.music-toggle.playing{border-color:var(--gold);background:rgba(201,168,76,0.12);animation:musicPulse 2s ease-in-out infinite}
@keyframes musicPulse{0%,100%{box-shadow:0 0 0 rgba(201,168,76,0)}50%{box-shadow:0 0 8px rgba(201,168,76,0.2)}}
.music-tracks{display:flex;gap:4px}
.music-track{padding:3px 10px;border-radius:12px;font-size:11px;color:var(--warm);opacity:.5;cursor:pointer;transition:all .3s;letter-spacing:1px;border:1px solid transparent;font-family:inherit;background:transparent}
.music-track:hover{opacity:.6}
.music-track.active{opacity:1;color:var(--gold);border-color:rgba(201,168,76,0.25);background:rgba(201,168,76,0.06)}
.music-progress{width:180px;height:3px;-webkit-appearance:none;appearance:none;background:rgba(201,168,76,0.15);border-radius:2px;outline:none;cursor:pointer}
.music-progress::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--gold);opacity:.6;cursor:pointer}
.music-progress::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--gold);border:none;cursor:pointer}

/* 信息栏 */
.info-bar{display:flex;gap:20px;justify-content:center;align-items:center;padding:4px 0 0}
.info-item{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--warm);opacity:.7;letter-spacing:1px;cursor:default}
.info-item.clickable{cursor:pointer;transition:opacity .3s}
.info-item.clickable:hover{opacity:.7}
.info-num{color:var(--gold);font-size:14px;opacity:.9}
.info-sep{width:1px;height:10px;background:rgba(201,168,76,0.1)}

/* 弹窗 */
.modal-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(6px)}
.modal-bg.show{display:flex}
.modal-card{width:100%;max-width:300px;background:linear-gradient(180deg,#1C1610,#14100C);border:1px solid rgba(201,168,76,0.15);border-radius:16px;padding:24px 20px;animation:modalIn .3s ease}
@keyframes modalIn{from{transform:translateY(15px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-heading{text-align:center;font-size:17px;color:var(--gold);letter-spacing:6px;margin-bottom:18px;font-weight:300}
.modal-btns{display:flex;gap:10px}
.modal-btn{flex:1;padding:9px;border-radius:8px;font-size:13px;font-family:inherit;cursor:pointer;letter-spacing:2px;border:none;transition:all .3s}
.m-cancel{background:rgba(255,255,255,0.05);color:var(--warm)}
.m-ok{background:linear-gradient(135deg,rgba(201,168,76,0.2),rgba(201,168,76,0.08));color:var(--gold);border:1px solid rgba(201,168,76,0.25)}
.wish-types{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.wish-type-btn{padding:8px 2px;background:rgba(201,168,76,0.04);border:1px solid rgba(201,168,76,0.12);border-radius:8px;text-align:center;font-size:13px;color:var(--warm);cursor:pointer;transition:all .3s;font-family:inherit}
.wish-type-btn.sel{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.1)}
.wish-textarea{width:100%;padding:10px;background:rgba(0,0,0,.4);border:1px solid rgba(201,168,76,0.15);border-radius:8px;color:var(--warm);font-size:14px;font-family:inherit;resize:none;outline:none;margin-bottom:14px}
.wish-textarea::placeholder{color:rgba(245,230,200,0.3)}.wish-textarea:focus{border-color:rgba(201,168,76,0.3)}
.lamp-modal-buddhas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.buddha-card{padding:10px 4px;background:rgba(201,168,76,0.03);border:1px solid rgba(201,168,76,0.08);border-radius:10px;text-align:center;cursor:pointer;transition:all .3s;font-family:inherit}
.buddha-card.sel{border-color:var(--gold);background:rgba(201,168,76,0.1)}
.buddha-card-name{font-size:14px;color:var(--gold);margin-bottom:2px}
.buddha-card-desc{font-size:11px;color:var(--warm);opacity:.55}
.wish-wall-list{max-height:50vh;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.wish-wall-list::-webkit-scrollbar{display:none}
.wall-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(0,0,0,.2);border-radius:8px;border:1px solid rgba(201,168,76,0.06)}
.wall-type{font-size:11px;color:var(--gold);padding:2px 6px;background:rgba(201,168,76,0.1);border-radius:4px;flex-shrink:0}
.wall-text{font-size:13px;color:var(--warm);flex:1}
.wall-date{font-size:11px;color:rgba(245,230,200,0.35);flex-shrink:0}

/* 分享弹窗 */
.share-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.share-item{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(0,0,0,.3);border:1px solid rgba(201,168,76,0.08);border-radius:10px;cursor:pointer;transition:all .3s;font-family:inherit}
.share-item:hover{border-color:rgba(201,168,76,0.3);background:rgba(201,168,76,0.05)}
.share-icon{font-size:20px;width:32px;text-align:center}
.share-label{font-size:14px;color:var(--warm)}
.share-desc{font-size:11px;color:var(--warm);opacity:.5;margin-top:2px}

/* 节气弹窗 */
.fest-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid rgba(201,168,76,0.1)}
.fest-tab{flex:1;padding:8px 0;text-align:center;font-size:13px;color:var(--warm);opacity:.6;cursor:pointer;transition:all .3s;letter-spacing:2px;border-bottom:2px solid transparent}
.fest-tab.active{color:var(--gold);opacity:1;border-bottom-color:var(--gold)}
.fest-list{max-height:50vh;overflow-y:auto;scrollbar-width:none}
.fest-list::-webkit-scrollbar{display:none}
.fest-group{margin-bottom:12px}
.fest-group-title{font-size:12px;color:var(--gold);opacity:.65;letter-spacing:3px;padding:6px 0 4px;border-bottom:1px solid rgba(201,168,76,0.08);margin-bottom:8px}
.fest-row{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:6px;background:rgba(201,168,76,0.03);border:1px solid rgba(201,168,76,0.06);border-radius:10px;transition:all .3s}
.fest-row:hover{border-color:rgba(201,168,76,0.15);background:rgba(201,168,76,0.06)}
.fest-row-icon{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.fest-row-body{flex:1;min-width:0}
.fest-row-name{font-size:15px;color:var(--gold);letter-spacing:1px;margin-bottom:2px}
.fest-row-desc{font-size:12px;color:var(--warm);opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fest-row-date{font-size:12px;color:var(--warm);opacity:.4;flex-shrink:0;letter-spacing:1px}
.fest-row.is-today{border-color:rgba(201,168,76,0.25);background:rgba(201,168,76,0.08)}
.fest-row.is-today .fest-row-name{opacity:1}
.fest-row.is-today::after{content:'今日';font-size:8px;color:var(--gold);opacity:.6;padding:1px 5px;border:1px solid rgba(201,168,76,0.2);border-radius:4px;margin-left:auto;flex-shrink:0}

.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%) translateY(-10px);padding:8px 22px;background:rgba(20,16,12,.95);border:1px solid rgba(201,168,76,0.3);border-radius:20px;color:var(--gold);font-size:13px;letter-spacing:1px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== 抽签摇卦 ===== */
.divine-modal-card{max-width:360px;padding:28px 24px}
.divine-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid rgba(201,168,76,0.1)}
.divine-tab{flex:1;padding:8px 0;text-align:center;font-size:13px;color:var(--warm);opacity:.6;cursor:pointer;transition:all .3s;letter-spacing:2px;border-bottom:2px solid transparent;font-family:inherit}
.divine-tab.active{color:var(--gold);opacity:1;border-bottom-color:var(--gold)}

/* 签筒 */
.divine-stage{text-align:center;padding:10px 0 16px}
.divine-tube{display:inline-block;width:70px;height:110px;background:linear-gradient(180deg,#5A4030 0%,#4A3525 30%,#3A2520 100%);border-radius:8px 8px 32px 32px;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 0 15px rgba(0,0,0,.3);transition:transform .3s}
.divine-tube::before{content:'';position:absolute;top:-3px;left:8px;right:8px;height:6px;background:linear-gradient(180deg,#7A5A40,#5A4030);border-radius:3px}
.divine-tube::after{content:'籤';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:var(--gold);opacity:.4}
.divine-tube .sticks-mini{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:30px;height:80px;display:flex;justify-content:center;gap:2px}
.divine-tube .sticks-mini span{display:block;width:3px;background:linear-gradient(to bottom,#C9A84C,#8A7030);border-radius:1px}
.divine-tube.shaking{animation:tubeShake .4s ease-in-out infinite}
@keyframes tubeShake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}

/* 摇卦铜钱 */
.coin-area{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 0}
.divine-coin{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#B8860B 30%,#8B6914 50%,#5B4210 100%);display:flex;align-items:center;justify-content:center;border:2px solid #5B4210;box-shadow:0 3px 8px rgba(0,0,0,.4);transition:transform .3s}
.divine-coin .coin-char{font-size:22px;color:#3A2520;font-weight:600;text-shadow:0 1px 0 rgba(255,215,0,.3)}
.divine-coin.flipping{animation:coinFlip .5s ease-out}
@keyframes coinFlip{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) scale(1.1)}100%{transform:rotateY(360deg)}}
.coin-result-row{display:flex;justify-content:center;gap:6px;margin-top:12px}
.coin-result{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid rgba(201,168,76,0.3)}
.coin-result.yang{background:rgba(201,168,76,0.15);color:var(--gold)}
.coin-result.yin{background:rgba(60,50,40,0.4);color:rgba(245,230,200,0.5)}

/* 摇卦爻线 */
.yao-lines{display:flex;flex-direction:column;gap:5px;margin:12px 0;align-items:center}
.yao-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--warm);opacity:.5}
.yao-row .yao-label{width:36px;text-align:right;letter-spacing:1px}
.yao-bar{display:flex;gap:3px}
.yao-seg{width:24px;height:8px;border-radius:1px;background:var(--gold);opacity:.85}
.yao-seg.broken{background:transparent;border:1px solid rgba(201,168,76,0.4)}
.yao-row.active{opacity:1}
.yao-row.active .yao-label{color:var(--gold)}

/* 签诗结果 */
.divine-result{display:none;text-align:center;padding:12px 0}
.divine-result.show{display:block;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.divine-num{font-size:13px;color:var(--gold);opacity:.7;letter-spacing:2px;margin-bottom:8px}
.divine-title{font-size:17px;color:var(--gold);letter-spacing:3px;margin-bottom:10px;font-weight:300}
.divine-poem{font-size:14px;color:var(--warm);opacity:.85;line-height:2;letter-spacing:1px;margin-bottom:12px;white-space:pre-line}
.divine-meaning{font-size:12px;color:var(--warm);opacity:.55;line-height:1.8;margin-bottom:12px}
.divine-level{display:inline-block;padding:3px 12px;border-radius:12px;font-size:12px;letter-spacing:2px;margin-bottom:12px}
.divine-level.upper{background:rgba(201,168,76,0.15);color:var(--gold);border:1px solid rgba(201,168,76,0.3)}
.divine-level.mid{background:rgba(201,168,76,0.08);color:var(--warm);border:1px solid rgba(201,168,76,0.2)}
.divine-level.lower{background:rgba(120,80,60,0.1);color:rgba(245,230,200,0.5);border:1px solid rgba(120,80,60,0.2)}

/* 摇卦结果 - 卦象 */
.hexagram-display{margin:8px 0}
.hexagram-name{font-size:18px;color:var(--gold);letter-spacing:4px;margin-bottom:4px;font-weight:300}
.hexagram-symbol{font-size:13px;color:var(--warm);opacity:.5;margin-bottom:8px}
.hexagram-desc{font-size:12px;color:var(--warm);opacity:.6;line-height:1.8;margin-bottom:10px}

.divine-again{padding:8px 20px;border-radius:14px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.25);color:var(--gold);font-size:13px;font-family:inherit;letter-spacing:2px;cursor:pointer;transition:all .3s}
.divine-again:hover{border-color:var(--gold);background:rgba(202,168,76,0.12)}
.divine-again:active{transform:scale(.96)}

    <ellipse cx="0" cy="-28" rx="16" ry="40" fill="rgba(232,180,184,0.5)" transform="rotate(315)"/>

<script>
const SK='zenBlessing';
function gd(){try{return JSON.parse(localStorage.getItem(SK))||{}}catch{return{}}}
function sd(d){localStorage.setItem(SK,JSON.stringify({...gd(),...d}))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

// ===== Web Audio 音效 =====
let audioCtx=null;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}

// 敲钟音效 - 真实寺庙钟声
let bellAudio=null;
function ringBell(){
  if(!bellAudio){bellAudio=new Audio('audio/bell.wav');bellAudio.volume=0.8}
  bellAudio.currentTime=0;bellAudio.play().catch(()=>{});
  toast('晨钟暮鼓 · 消除烦恼');
}

// 念经音效 - 低频嗡鸣
function chantSound(){
  const ctx=getAudio();const t=ctx.currentTime;
  const freqs=[131,196,262]; // C3 G3 C4 Om
  freqs.forEach((f,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(f,t);
    // 缓慢起声
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.08-i*0.015,t+0.8);
    gain.gain.linearRampToValueAtTime(0.06-i*0.01,t+2.5);
    gain.gain.exponentialRampToValueAtTime(0.001,t+4);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(t);osc.stop(t+4);
  });
}

// 供灯音效 - 清脆叮
function lampSound(){
  const ctx=getAudio();const t=ctx.currentTime;
  const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(880,t); // A5
  gain.gain.setValueAtTime(0.1,t);gain.gain.exponentialRampToValueAtTime(0.001,t+1);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+1);
}

// 签到音效
function checkinSound(){
  const ctx=getAudio();const t=ctx.currentTime;
  [660,880].forEach((f,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(f,t+i*0.15);
    gain.gain.setValueAtTime(0.08,t+i*0.15);gain.gain.exponentialRampToValueAtTime(0.001,t+i*0.15+0.8);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(t+i*0.15);osc.stop(t+i*0.15+0.8);
  });
}

// ===== 香型 =====
const INC_TYPES=['sandalwood','aloeswood','lily'];
function randomIncense(){return INC_TYPES[Math.floor(Math.random()*INC_TYPES.length)]}
function showIncType(type){document.querySelectorAll('.incense-opt').forEach(e=>e.classList.remove('active'));document.querySelector(`.incense-opt[data-type="${type}"]`)?.classList.add('active');selInc=type}
let selInc='sandalwood';

// ===== 上香 =====
const MAX_S=3;
function offerIncense(){
  const d=gd();const cur=(d.activeIncense||[]).filter(i=>Date.now()-i.st<i.dur);
  if(cur.length>=MAX_S){toast('香炉已满');return}
  const type=randomIncense();showIncType(type);
  cur.push({id:Date.now(),type,st:Date.now(),dur:1800000});
  d.activeIncense=cur;d.totalInc=(d.totalInc||0)+1;sd(d);
  renderSticks();startSmoke();updateInfo();
  chantSound(); // 念经音效
  toast('阿弥陀佛 · 香已点燃');
}

function renderSticks(){
  const d=gd();const cur=(d.activeIncense||[]).filter(i=>Date.now()-i.st<i.dur);
  if(cur.length!==(d.activeIncense||[]).length){d.activeIncense=cur;sd(d)}
  const row=document.getElementById('sticksRow');row.innerHTML='';
  cur.forEach(inc=>{
    const rem=Math.max(0,1-(Date.now()-inc.st)/inc.dur);
    const s=document.createElement('div');s.className='stick lit';s.style.height=(48*rem)+'px';
    if(rem>0){const e=document.createElement('div');e.className='ember';s.appendChild(e)}
    row.appendChild(s);
  });
  const btn=document.getElementById('btnIncense');
  btn.disabled=cur.length>=MAX_S;btn.textContent=cur.length>=MAX_S?'香炉已满':'请 香';
  if(cur.length>0)requestAnimationFrame(renderSticks);
}

// ===== 烟雾 =====
const cvs=document.getElementById('smokeCanvas'),ctx=cvs.getContext('2d');
let particles=[],animId=null;

class P{constructor(x,y,c){this.x=x+(Math.random()-.5)*14;this.y=y;this.vx=(Math.random()-.5)*.2;this.vy=-(Math.random()*.5+.15);this.r=Math.random()*2.5+1;this.a=.25+Math.random()*.15;this.c=c;this.life=1;this.dk=.0015+Math.random()*.002}up(){this.x+=this.vx;this.y+=this.vy;this.vx+=(Math.random()-.5)*.03;this.r+=.02;this.life-=this.dk;this.a*=.998}draw(c){c.beginPath();c.arc(this.x,this.y,this.r,0,Math.PI*2);c.fillStyle=this.c.replace('rgb','rgba').replace(')',`,${this.a*this.life})`);c.fill()}}
function startSmoke(){if(!animId)drawSmoke()}
function drawSmoke(){const cw=cvs.width,ch=cvs.height;ctx.clearRect(0,0,cw,ch);const d=gd();const act=(d.activeIncense||[]).filter(i=>Date.now()-i.st<i.dur);const cols={sandalwood:'rgb(180,160,130)',aloeswood:'rgb(140,120,90)',lily:'rgb(200,190,170)'};const cvsRect=cvs.getBoundingClientRect();const embers=document.querySelectorAll('.stick .ember');if(act.length>0)act.forEach((inc,i)=>{const c=cols[inc.type]||cols.sandalwood;const off=(i-(act.length-1)/2)*9;if(embers[i]){const eR=embers[i].getBoundingClientRect();const px=eR.left+eR.width/2-cvsRect.left;const py=eR.top+eR.height/2-cvsRect.top;if(Math.random()<.18)particles.push(new P(px,py,c))}else if(Math.random()<.18){particles.push(new P(cw/2+off,ch-5,c))}});particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.up();p.draw(ctx)});if(act.length>0||particles.length>0)animId=requestAnimationFrame(drawSmoke);else animId=null}

// ===== 供灯环（圆弧排列+呼吸+出现动画） =====
function renderLampRing(){
  const d=gd();const lamps=d.lamps||{};
  const ring=document.getElementById('lampRing');ring.innerHTML='';
  let total=0;Object.values(lamps).forEach(n=>total+=n);
  const show=Math.min(total,9);
  const count=Math.max(show,5);
  // 圆弧分布
  const spread=160; // 横向展开px
  for(let i=0;i<count;i++){
    const l=document.createElement('div');l.className='mini-lamp'+(i<show?'':' empty');
    if(i===show-1&&show>0)l.classList.add('appear');
    // 计算位置 - 抛物线弧
    const t=count>1?i/(count-1):0.5;
    const x=(t-0.5)*spread;
    const y=-Math.pow(t-0.5,2)*30; // 弧形上凸
    l.style.left=`calc(50% + ${x}px - 7px)`;
    l.style.bottom=`${20-y}px`;
    l.style.animationDelay=(i*0.15)+'s';
    l.innerHTML='<div class="glow"></div><div class="flame"></div><div class="base"></div>';
    ring.appendChild(l);
  }
}

// ===== 许愿 =====
const wTypes=['家人平安','事业顺利','学业有成','身体健康','姻缘美满','财运亨通','众生所愿'];
let selWType=wTypes[0];
function initWishTypes(){const g=document.getElementById('wishTypes');wTypes.forEach(t=>{const b=document.createElement('div');b.className='wish-type-btn'+(t===selWType?' sel':'');b.textContent=t;b.onclick=()=>{document.querySelectorAll('.wish-type-btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selWType=t};g.appendChild(b)})}
function openWishModal(){document.getElementById('wishModal').classList.add('show');document.getElementById('wishInput').value=''}
function closeWishModal(){document.getElementById('wishModal').classList.remove('show')}
function submitWish(){const txt=document.getElementById('wishInput').value.trim();if(!txt){toast('请写下心愿');return}const d=gd();const w=d.wishes||[];w.unshift({type:selWType,text:txt,date:new Date().toLocaleDateString('zh-CN')});d.wishes=w;d.totalWish=(d.totalWish||0)+1;sd(d);closeWishModal();updateInfo();toast('心愿已送达')}
function openWallModal(){const d=gd();const w=d.wishes||[];const top={type:'众生所愿',text:'愿吉林省电信总经理唐诗词，早日高升',date:'众善信'};const pre=[{type:'家人平安',text:'愿家人安康，岁月静好',date:'众善信'},{type:'事业顺利',text:'愿事业通达，步步高升',date:'众善信'},{type:'学业有成',text:'愿金榜题名，学业有成',date:'众善信'},{type:'身体健康',text:'愿身心康泰，无灾无难',date:'众善信'},{type:'姻缘美满',text:'愿良缘天定，白首同心',date:'众善信'},{type:'财运亨通',text:'愿财源广进，富贵绵长',date:'众善信'}];const all=[top,...w,...pre];const list=document.getElementById('wishWallList');list.innerHTML='';all.forEach(v=>{const i=document.createElement('div');i.className='wall-item';i.innerHTML=`<div class="wall-type">${v.type}</div><div class="wall-text">${v.text}</div><div class="wall-date">${v.date}</div>`;list.appendChild(i)});document.getElementById('wallModal').classList.add('show')}
function closeWallModal(){document.getElementById('wallModal').classList.remove('show')}

// ===== 供灯 =====
const buddhas=[{id:'guanyin',name:'观音',desc:'大慈大悲'},{id:'maitreya',name:'弥勒',desc:'欢喜自在'},{id:'medicine',name:'药师',desc:'消灾延寿'},{id:'ksitigarbha',name:'地藏',desc:'誓不成佛'},{id:'manjushri',name:'文殊',desc:'般若智慧'},{id:'caishen',name:'财神',desc:'福德圆满'}];
let selBud='guanyin';
function initLampBuddhas(){const g=document.getElementById('lampBuddhas');buddhas.forEach((b,i)=>{const c=document.createElement('div');c.className='buddha-card'+(i===0?' sel':'');c.dataset.id=b.id;c.innerHTML=`<div class="buddha-card-name">${b.name}</div><div class="buddha-card-desc">${b.desc}</div>`;c.onclick=()=>{document.querySelectorAll('.buddha-card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');selBud=b.id};g.appendChild(c)})}
function openLampModal(){document.getElementById('lampModal').classList.add('show')}
function closeLampModal(){document.getElementById('lampModal').classList.remove('show')}
function submitLamp(){const d=gd();const l=d.lamps||{};l[selBud]=(l[selBud]||0)+1;d.lamps=l;d.totalLamp=(d.totalLamp||0)+1;sd(d);closeLampModal();renderLampRing();updateInfo();lampSound();toast('供灯功德 · 光明无量')}

function checkin(){const d=gd();const today=new Date().toDateString();if(d.lastCheckin===today){toast('今日已签到');return}const ck=(d.checkins||[]);ck.push(today);d.checkins=ck;d.lastCheckin=today;const prev=ck.filter(c=>c!==today);d.streak=(prev.length>0&&prev[prev.length-1]===new Date(Date.now()-864e5).toDateString())?(d.streak||0)+1:1;d.maxStreak=Math.max(d.maxStreak||0,d.streak);sd(d);updateInfo();showLotus();checkinSound();toast('签到功德 +1')}

function getFestivalToday(){
  const now=new Date();const m=now.getMonth()+1;const d=now.getDate();
  // 检查佛诞日
  const bd=buddhaDays.find(f=>f.m===m&&f.d===d);
  if(bd)return{type:'buddha',...bd};
  // 检查节气（±1天）
  const st=solarTerms.find(f=>f.m===m&&Math.abs(f.d-d)<=1);
  if(st)return{type:'solar',...st};
  return null;
}

function initFestivalBar(){
  const fest=getFestivalToday();
  const bar=document.getElementById('festBar');
  if(fest){
    const icon=fest.type==='buddha'?'🪷':'🍃';
    bar.innerHTML=`<span class="fest-icon">${icon}</span>${fest.name} · ${fest.desc}`;
    bar.classList.remove('hidden');
  }else{
    bar.classList.add('hidden');
  }
}

let festCurrentTab='buddha';
function switchFestTab(tab){
  festCurrentTab=tab;
  document.querySelectorAll('.fest-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  renderFestContent();
}
function renderFestContent(){
  const now=new Date();const cm=now.getMonth()+1;const cd=now.getDate();
  const content=document.getElementById('festContent');content.innerHTML='';
  const list=document.createElement('div');list.className='fest-list';
  if(festCurrentTab==='buddha'){
    // 佛诞日按月份分组
    const months=[...new Set(buddhaDays.map(f=>f.m))].sort((a,b)=>a-b);
    months.forEach(m=>{
      const items=buddhaDays.filter(f=>f.m===m);
      const group=document.createElement('div');group.className='fest-group';
      const title=document.createElement('div');title.className='fest-group-title';title.textContent=m+'月';
      group.appendChild(title);
      items.forEach(e=>{
        const row=document.createElement('div');row.className='fest-row';
        if(e.m===cm&&e.d===cd)row.classList.add('is-today');
        row.innerHTML=`<div class="fest-row-icon">🪷</div><div class="fest-row-body"><div class="fest-row-name">${e.name}</div><div class="fest-row-desc">${e.desc}</div></div><div class="fest-row-date">${e.m}/${e.d}</div>`;
        group.appendChild(row);
      });
      list.appendChild(group);
    });
  }else{
    // 节气按月份分组
    const months=[...new Set(solarTerms.map(f=>f.m))].sort((a,b)=>a-b);
    months.forEach(m=>{
      const items=solarTerms.filter(f=>f.m===m);
      const group=document.createElement('div');group.className='fest-group';
      const title=document.createElement('div');title.className='fest-group-title';title.textContent=m+'月';
      group.appendChild(title);
      items.forEach(e=>{
        const row=document.createElement('div');row.className='fest-row';
        if(e.m===cm&&Math.abs(e.d-cd)<=1)row.classList.add('is-today');
        row.innerHTML=`<div class="fest-row-icon">🍃</div><div class="fest-row-body"><div class="fest-row-name">${e.name}</div><div class="fest-row-desc">${e.desc}</div></div><div class="fest-row-date">${e.m}/${e.d}</div>`;
        group.appendChild(row);
      });
      list.appendChild(group);
    });
  }
  content.appendChild(list);
}

let musicPlaying=false, currentTrack='incense', audioEl=null;

// 音频文件路径映射（加v参数防浏览器缓存）
const audioFiles={
  incense:'audio/incense_loop.m4a?v=1',
  heart:'audio/heart_loop.wav?v=3',
  compassion:'audio/compassion_loop.m4a?v=4',
  mantra:'audio/mantra_loop.wav?v=3'
};

// 页面加载时预创建Audio对象，常驻缓存
const audioPool={};
Object.keys(audioFiles).forEach(k=>{
  const a=new Audio();a.preload='auto';a.loop=true;a.src=audioFiles[k];
  audioPool[k]=a;
});

function startMusic(){
  if(musicPlaying)return;
  const ctx=getAudio();
  if(ctx.state==='suspended')ctx.resume();

  const progCircle=document.querySelector('.music-prog');
  const circumference=2*Math.PI*16; // ≈100.53

  // 复用已缓存的Audio对象
  audioEl=audioPool[currentTrack];
  audioEl.currentTime=0;
  audioEl.volume=0.5;
  const progEl0=document.getElementById('musicProg');
  if(progEl0){progEl0.value=0;paintProg(0);}
  audioEl.addEventListener('timeupdate',onTimeUpdate);
  musicPlaying=true;
  document.getElementById('musicToggle').classList.add('playing');
  document.querySelector('.music-icon').innerHTML='&#9646;&#9646;';
  const d=gd();d.musicOn=true;d.musicTrack=currentTrack;sd(d);

  // 监听缓存进度，更新圆环
  function onProgress(){
    if(audioEl.buffered.length>0){
      const buf=audioEl.buffered.end(audioEl.buffered.length-1);
      const pct=buf/audioEl.duration;
      if(progCircle)progCircle.style.strokeDashoffset=circumference*(1-pct);
    }
  }
  audioEl.addEventListener('progress',onProgress);

  audioEl.addEventListener('canplaythrough',function onReady(){
    audioEl.removeEventListener('canplaythrough',onReady);
    audioEl.removeEventListener('progress',onProgress);
    if(progCircle)progCircle.style.strokeDashoffset='0';
    if(musicPlaying)audioEl.play().catch(()=>{});
  },{once:true});

  // 已缓存过则直接播放
  if(audioEl.readyState>=4){
    audioEl.removeEventListener('progress',onProgress);
    if(progCircle)progCircle.style.strokeDashoffset='0';
    audioEl.play().catch(()=>{});
  }else{
    audioEl.load();
  }
}

function stopMusic(){
  if(!musicPlaying)return;
  if(audioEl){audioEl.pause();audioEl.removeEventListener('timeupdate',onTimeUpdate)}
  musicPlaying=false;
  document.getElementById('musicToggle').classList.remove('playing');
  document.querySelector('.music-icon').innerHTML='&#9654;';
  // 重置圆环进度
  const progCircle=document.querySelector('.music-prog');
  const circumference=2*Math.PI*16;
  if(progCircle)progCircle.style.strokeDashoffset=circumference;
  // 重置进度条
  const progEl=document.getElementById('musicProg');
  if(progEl){progEl.value=0;paintProg(0)}
  const d=gd();d.musicOn=false;sd(d);
}

function onTimeUpdate(){
  if(!audioEl||!isFinite(audioEl.duration)||audioEl.duration<=0)return;
  const pct=audioEl.currentTime/audioEl.duration*100;
  const el=document.getElementById('musicProg');
  if(el&&document.activeElement!==el){el.value=pct;paintProg(pct)}
}

function paintProg(pct){
  const el=document.getElementById('musicProg');
  if(el)el.style.background='linear-gradient(90deg,rgba(201,168,76,0.55) '+pct+'%,rgba(201,168,76,0.15) '+pct+'%)';
}

function seekMusic(v){
  if(audioEl&&isFinite(audioEl.duration)&&audioEl.duration>0){
    audioEl.currentTime=v/100*audioEl.duration;
  }
  paintProg(v);
}

function toggleMusic(){
  if(musicPlaying)stopMusic();else startMusic();
}

function selectTrack(track){
  currentTrack=track;
  document.querySelectorAll('.music-track').forEach(t=>t.classList.toggle('active',t.dataset.track===track));
  if(musicPlaying){stopMusic();startMusic()}
  const d=gd();d.musicTrack=track;sd(d);
}

function restoreMusic(){
  const d=gd();
  if(d.musicTrack){
    currentTrack=d.musicTrack;
    document.querySelectorAll('.music-track').forEach(t=>t.classList.toggle('active',t.dataset.track===d.musicTrack));
  }
}

{t:"第二十七签",p:"君今百事且随缘\n水到渠成听自然\n莫叹年来不如意\n喜逢新月再团圆",l:"中上",m:"水到渠成，喜逢团圆"},
{t:"第二十八签",p:"鼓盆兴乐在其中\n野鬼奸神怕正容\n灾不灾时人不晓\n但看春色又逢春",l:"中",m:"正气压邪，春回大地"},
{t:"第二十九签",p:"宝剑光芒出匣时\n恍然天地变璇玑\n从中请来无少碍\n再归玉殿喜生辉",l:"上上",m:"宝剑出匣，光辉再现"},
{t:"第三十签",p:"宛如行入桃源洞\n闲花野草尽芬芳\n劝君须当心改求\n闲非闲事莫招忧",l:"上",m:"闲花野草，无忧无虑"},
{t:"第三十一签",p:"事如逐鹿不知足\n何曾顷刻心安乐\n若能修省安己分\n何愁名利不到家",l:"中",m:"安分守己，名利自来"},
{t:"第三十二签",p:"宛如行入桃源洞\n闲花野草尽芬芳\n劝君须当心改求\n那是非时自消殃",l:"中上",m:"桃源入境，是非自消"},
{t:"第三十三签",p:"风云会合喜重重\n惊起鳌头第一峰\n定有高人来助手\n何愁宦海起狂波",l:"上",m:"贵人相助，何愁风波"},
{t:"第三十四签",p:"行藏出入礼义恭\n言必忠良信可从\n必有高人来讲道\n天书初下日生辉",l:"上上",m:"忠信待人，天书降辉"},
{t:"第三十五签",p:"佳人才子两相宜\n红日当空万象辉\n雨过天晴山色翠\n何愁富室不丰时",l:"上上",m:"佳人才子，雨过天晴"},
{t:"第三十六签",p:"福如东海寿如山\n君尔何须叹苦甘\n自有太阳丕极泰\n门庭光耀喜重重",l:"上上",m:"福寿双全，否极泰来"},
{t:"第三十七签",p:"莫笑愚人独力贫\n太公八十遇文君\n时来鱼跃龙门去\n一举登科四海闻",l:"上上",m:"太公八十，时来运至"},
{t:"第三十八签",p:"事须问根叶\n车行历远山\n且把心安守\n求谋可逐全",l:"中",m:"安守本分，求谋可成"},
{t:"第三十九签",p:"天边消息实难思\n平地风云不可期\n却笑棘中猴跳木\n不知笑里暗藏机",l:"中下",m:"风云莫测，笑里藏刀"},
{t:"第四十签",p:"新月团圆映碧天\n问君此去定无缘\n且待交节时过后\n自然福至庆安全",l:"中",m:"待节过后，福至安全"},
{t:"第四十一签",p:"龙虎相随在深山\n君今何用苦疑猜\n如今财禄完成就\n渐入唐尧禅舜年",l:"上",m:"龙虎相随，唐尧舜年"},
{t:"第四十二签",p:"隐隐仙柯来降庭\n分明八语报佳音\n须知进退知成败\n何劳心下再沉吟",l:"中上",m:"仙柯降庭，知进退道"},
{t:"第四十三签",p:"无相可相无火光\n人间天上一般般\n要知造化分明在\n只恐是非值岁寒",l:"中",m:"造化分明，恐遇岁寒"},
{t:"第四十四签",p:"棋逢对手不知羞\n好似将军遇英雄\n宽心且看年终月\n管取花开百事逢",l:"中上",m:"棋逢对手，年终得意"},
{t:"第四十五签",p:"温柔自古胜刚强\n积善之门大吉昌\n若是有人占此卦\n渐渐亨通福自强",l:"上",m:"温柔胜刚，积善吉昌"},
{t:"第四十六签",p:"客中遇凶事难当\n自有福星来照临\n自起惊心鸿渐过\n自然忧化泰来时",l:"中上",m:"逢凶化吉，遇险呈祥"},
{t:"第四十七签",p:"鸠饮山涧水鹞\n月黑风高将害人\n虽有惺惺几分意\n不知天理报应分",l:"下",m:"小人暗害，天理报应"},
{t:"第四十八签",p:"五色祥云屋上飘\n门庭增彩定增高\n从今好事临门户\n咫尺青云志愿豪",l:"上上",m:"祥云缭绕，好事临门"},
{t:"第四十九签",p:"言必忠良信可行\n只宜寂静莫纷更\n自然水到渠成长\n何必区区惹挂牵",l:"中上",m:"忠信行事，水到渠成"},
{t:"第五十签",p:"春风初临百花开\n万物从此得新生\n但看交节秋月内\n管取亨通得成就",l:"上",m:"春风百开，交节亨通"},
{t:"第五十一签",p:"求神问卜须诚意\n灵感临身百事通\n从兹渐渐求谋望\n玉汝于成贺太平",l:"上",m:"诚意求神，渐渐成就"},
{t:"第五十二签",p:"忧愁常锁两眉间\n欲解愁眉始亦难\n忽报阳春行入户\n从兹喜气霭门栏",l:"中上",m:"愁眉渐展，喜气临门"},
{t:"第五十三签",p:"贤臣圣主得相投\n法立如山不可收\n但教胸中存正气\n何愁天下不归周",l:"上",m:"君臣相投，天下归心"},
{t:"第五十四签",p:"难得心平日渐稳\n安闲此际不须求\n吉人自有天相报\n笑看浮云空自飘",l:"中上",m:"心安理得，天相吉人"},
{t:"第五十五签",p:"父母遗下财产多\n不知安乐又如何\n虽是金玉成富贵\n也须谨慎用心机",l:"中",m:"富贵也须谨慎用心"},
{t:"第五十六签",p:"好花初绽遇狂风\n勿叹今朝事未通\n设若秋深霜雪至\n须教叶落又归根",l:"下",m:"好花遇风，叶落归根"},
{t:"第五十七签",p:"事端出路莫追求\n旧事从新恐可忧\n只可偷闲随分过\n休生万事起无由",l:"中下",m:"莫追旧事，安分过日子"},
{t:"第五十八签",p:"从前作事总糊涂\n见有危难受辛勤\n今日相逢方醒悟\n从今作事用心机",l:"中",m:"前事糊涂，今日醒悟"},
{t:"第五十九签",p:"百年原是好姻缘\n谁料中间生波澜\n雨过天晴还又展\n桃花依旧笑春风",l:"中上",m:"好事多磨，终归圆满"},
{t:"第六十签",p:"抱最一片太阳心\n不管浮云遮太空\n待到中秋月色好\n从兹渐渐到成功",l:"上",m:"守心不改，终见月明"},
{t:"第六十一签",p:"风波忽起莫惊惶\n啸傲山林在正堂\n此身自有重阳日\n何愁不得到春光",l:"中上",m:"风波莫惊，终见春光"},
{t:"第六十二签",p:"秉心正直莫胡为\n事到头时自不亏\n天然秋月连春花\n定有高人为解围",l:"上",m:"心正不亏，高人解围"},
{t:"第六十三签",p:"物极必反理之常\n小人勿用恐忧惊\n如今但守当时事\n只待鸡鸣犬吠声",l:"中",m:"物极必反，守时待变"},
{t:"第六十四签",p:"譬如困龙欲上天\n且待风云际会时\n终有升腾越海日\n不在旁人得志期",l:"中上",m:"困龙待时，终将升腾"},
{t:"第六十五签",p:"生前作福天生善\n不是修德是何因\n总然富贵如花秀\n也恐荣华有尽时",l:"中",m:"修德积福，荣华有尽"},
{t:"第六十六签",p:"路逢险处又难行\n远信传来事可惊\n莫谓风波交九难\n重重化吉保安宁",l:"中",m:"险处难行，化吉安宁"},
{t:"第六十七签",p:"怪异忧危事不轻\n须求神佛保其身\n却将险境安心定\n自有春回万物新",l:"中",m:"求神安定，春回万物"},
{t:"第六十八签",p:"船中明月半明时\n守旧安然可待期\n为问出行何日好\n中秋明月照归期",l:"中上",m:"守旧待时，中秋归期"},
{t:"第六十九签",p:"事如逐鹿不知足\n何曾顷刻心安乐\n若能修省安己分\n那有闲非到尔屋",l:"中",m:"安己分则无是非"},
{t:"第七十签",p:"乘马班如须进步\n一阳来复保安宁\n水边林下同相守\n那有风波到尔庭",l:"上",m:"一阳来复，水边安宁"},
{t:"第七十一签",p:"谁知苍狗白云飞\n造化从兹不可期\n回首故乡音信远\n夕阳西下故人稀",l:"中下",m:"世事莫测，故人稀少"},
{t:"第七十二签",p:"弄巧反成拙\n作福反得祸\n不如守本分\n平安过生活",l:"下",m:"弄巧成拙，守本分安"},
{t:"第七十三签",p:"春雷震起屈蟠龙\n万里风云任卷舒\n一跃过禹门三级\n飞腾变化在须臾",l:"上上",m:"春雷惊龙，一跃龙门"},
{t:"第七十四签",p:"似鸿飞冥冥\n乃得全其身\n事到全美处\n自有好人逢",l:"上",m:"鸿飞冥冥，终遇好人"},
{t:"第七十五签",p:"急水滩头泛一舟\n且喜来到岸边头\n过去暗事都不见\n舟中又有一轮收",l:"中上",m:"险中得安，又有收获"},
{t:"第七十六签",p:"何劳苦苦暗商量\n谋望之中巧中拙\n不如旧消息好\n水边林下好安身",l:"中",m:"不必苦谋，安身水边"},
{t:"第七十七签",p:"梦中说梦获资财\n不知身外有身来\n若能修省存心正\n自有前程花共开",l:"中上",m:"修省存心，前程花开"},
{t:"第七十八签",p:"事须问根叶\n车行历远山\n且把心安守\n渐入那不归",l:"中",m:"安心守分，渐入佳境"},
{t:"第七十九签",p:"虚心请教问行藏\n前程无阻去路长\n只为坚守难为计\n守旧安然待好音",l:"中上",m:"虚心请教，守旧待音"},
{t:"第八十签",p:"直上高山第一奇\n谁知此处有仙家\n炼金丹成飞升去\n玉皇端拱坐明堂",l:"上上",m:"仙家丹成，玉皇明堂"},
{t:"第八十一签",p:"梧桐落叶惊秋至\n蟋蟀悲鸣月满庭\n若有君子知进退\n自然身守大吉昌",l:"中",m:"知进退者，自得吉昌"},
{t:"第八十二签",p:"白云本是山中物\n随风飘荡到天边\n我本痴人无忧虑\n笑向桃花又一年",l:"中",m:"白云随风，无忧度日"},
{t:"第八十三签",p:"岂可虚度过韶华\n一旦飘零到海涯\n回头方悔从前错\n光阴虚度等恒沙",l:"下",m:"莫虚度光阴，否则后悔"},
{t:"第八十四签",p:"只因闲事笑谈间\n不知暗里起波澜\n如今且把心休歇\n自有安居不用忙",l:"中",m:"闲事生波，心歇安居"},
{t:"第八十五签",p:"云中白鹤自翱翔\n万里青天一点光\n若问君家全盛事\n儿孙兴旺满堂华",l:"上上",m:"白鹤翱翔，儿孙满堂"},
{t:"第八十六签",p:"春来花发映阳台\n万里车帆进取来\n进宝进财真吉庆\n家眷安宁大发财",l:"上上",m:"春花映台，进财吉庆"},
{t:"第八十七签",p:"百花春至莺花舞\n拍手欣欣贺太平\n身伴君王多宠赐\n满门福禄自天成",l:"上上",m:"百花春至，天赐福禄"},
{t:"第八十八签",p:"从来作事有人扶\n有事不成只暗图\n今日青龙入世位\n何愁宝物不珍图",l:"上",m:"有人相助，青龙入世"},
{t:"第八十九签",p:"圣意分明有主张\n从兹天下不须忙\n佳人才子欢相合\n明月清风满画堂",l:"上上",m:"圣意分明，佳人相合"},
{t:"第九十签",p:"忽朝一日天书降\n四海欢歌贺太平\n君有奇才施可用\n何愁功业不成名",l:"上上",m:"天书降临，功业成名"},
{t:"第九十一签",p:"好事心中要守终\n何愁天下不从容\n前程有路通仙桂\n渐渐长安到九重",l:"上",m:"坚持好事，前程通桂"},
{t:"第九十二签",p:"乃知乃信事方成\n若到秋深月再明\n凡事至期知进退\n何愁天下不回心",l:"中上",m:"知信息则事成"},
{t:"第九十三签",p:"宽心且看月中桂\n正是中秋花正开\n花到中秋奇异常\n何愁不得到仙堂",l:"上",m:"中秋月桂，仙堂可期"},
{t:"第九十四签",p:"天恩降下好几番\n事到头来不等闲\n若能修省安己分\n何愁不到玉门关",l:"上",m:"天恩降下，修己达标"},
{t:"第九十五签",p:"改过前非向前行\n从兹好事得圆成\n作善百般天赐福\n自然通达利名声",l:"上",m:"改过从善，名声自达"},
{t:"第九十六签",p:"贵人相逢在路旁\n有事相须两相帮\n只因方寸心无愧\n到处逢人皆吉祥",l:"上",m:"贵人路逢，心无愧则吉"},
{t:"第九十七签",p:"江河风浪起青萍\n舟子愁眉未可行\n若待风平浪又静\n管取云中有路通",l:"中上",m:"风浪未平，待静通行"},
{t:"第九十八签",p:"五服之内有亲情\n凡事商量得好音\n问水问山无不就\n管取亨通入宝林",l:"上",m:"亲族相助，亨通入林"},
{t:"第九十九签",p:"行藏出入门庭光\n好事临门大吉昌\n更用福星添瑞气\n身安命稳保安康",l:"上",m:"门庭光耀，身安命稳"},
{t:"第一百签",p:"我本天仙庵内人\n千年松柏又逢春\n若得此签非小可\n后望无穷百事遂",l:"上上",m:"千年松柏，百事如意"}
];

// 切换签/卦tab
function switchDivineTab(mode){
  divineMode=mode;
  document.querySelectorAll('.divine-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));
  document.getElementById('divineSignPanel').style.display=mode==='sign'?'block':'none';
  document.getElementById('divineCoinPanel').style.display=mode==='coin'?'block':'none';
}

function openDivineModal(){document.getElementById('divineModal').classList.add('show')}

// ===== 求签 =====
function drawSign(){
  const tube=document.getElementById('divineTube');
  const btn=document.getElementById('btnDrawSign');
  btn.disabled=true;btn.textContent='摇签中…';
  tube.classList.add('shaking');
  // 签筒音效
  chantSound();
  setTimeout(()=>{
    tube.classList.remove('shaking');
    const idx=Math.floor(Math.random()*100);
    const sign=guanyinSigns[idx];
    document.getElementById('signNum').textContent=sign.t+' · 第'+(idx+1)+'签';
    document.getElementById('signTitle').textContent=sign.p.split('\n')[0].slice(0,7)+'…';
    document.getElementById('signPoem').textContent=sign.p;
    const lvEl=document.getElementById('signLevel');
    lvEl.textContent=sign.l+'签';
    lvEl.className='divine-level '+(sign.l.includes('上上')?'upper':(sign.l.includes('上')?'mid':(sign.l.includes('下下')?'lower':'mid')));
    document.getElementById('signMeaning').textContent='解：'+sign.m;
    document.getElementById('signResult').classList.add('show');
    document.getElementById('signBtns').style.display='none';
    document.getElementById('signAgainBtns').style.display='flex';
    // 保存记录
    const d=gd();const divs=d.divinations||[];
    divs.unshift({type:'sign',num:idx+1,title:sign.t,level:sign.l,date:new Date().toLocaleDateString('zh-CN')});
    d.divinations=divs;sd(d);
    // 莲花动画
    showLotus();
  },1500);
}

function resetSign(){
  document.getElementById('signResult').classList.remove('show');
  document.getElementById('signAgainBtns').style.display='none';
  document.getElementById('signBtns').style.display='flex';
  const btn=document.getElementById('btnDrawSign');
  btn.disabled=false;btn.textContent='摇 签';
}

// ===== 摇卦 =====
let coinTossCount=0;
let yaoResults=[]; // 六爻结果

function tossCoin(){
  if(coinTossCount>=6)return;
  const btn=document.getElementById('btnTossCoin');
  btn.disabled=true;btn.textContent='摇卦中…';
  const coins=[document.getElementById('coin1'),document.getElementById('coin2'),document.getElementById('coin3')];
  coins.forEach(c=>c.classList.add('flipping'));
  // 摇卦音效
  const ctx=getAudio();const t=ctx.currentTime;
  [523,659,784].forEach((f,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='triangle';osc.frequency.setValueAtTime(f,t+i*0.05);
    gain.gain.setValueAtTime(0.06,t+i*0.05);gain.gain.exponentialRampToValueAtTime(0.001,t+i*0.05+0.3);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(t+i*0.05);osc.stop(t+i*0.05+0.3);
  });
  setTimeout(()=>{
    coins.forEach(c=>c.classList.remove('flipping'));
    // 三枚铜钱，正面(字)为阴=2，反面(背)为阳=3
    // 两阳一阴 = 少阴 (7) 静
    // 两阴一阳 = 少阳 (8) 静
    // 三阳 = 老阳 (9) 动变阴
    // 三阴 = 老阴 (6) 动变阳
    let yangCount=0;
    let coinChars=[];
    coins.forEach((c,i)=>{
      const isYang=Math.random()>0.5;
      if(isYang)yangCount++;
      coinChars.push(isYang?'字':'背');
      c.querySelector('.coin-char').textContent=isYang?'字':'背';
    });
    // 显示本次三钱结果
    const rr=document.getElementById('coinResultRow');
    const cr=document.createElement('div');
    cr.className='coin-result';
    coins.forEach(c=>{
      const isYang=c.querySelector('.coin-char').textContent==='字';
      cr.classList.add(isYang?'yang':'yin');
    });
    // 简单显示
    let yaoType;
    if(yangCount===3){yaoType={type:'oldYang',val:'老阳 ○',symbol:'yang'};coinTossCount}
    else if(yangCount===2){yaoType={type:'youngYin',val:'少阴 ╸',symbol:'broken'}}
    else if(yangCount===1){yaoType={type:'youngYang',val:'少阳 ━',symbol:'yang'}}
    else{yaoType={type:'oldYin',val:'老阴 ✕',symbol:'broken'}}
    yaoResults.push({...yaoType,coins:coinChars});
    renderYaoLines();
    coinTossCount++;
    if(coinTossCount>=6){
      // 解卦
      setTimeout(()=>interpretHexagram(),300);
    }else{
      btn.disabled=false;
      btn.textContent='摇卦（'+coinTossCount+'/6）';
    }
  },500);
}

function renderYaoLines(){
  const container=document.getElementById('yaoLines');
  const labels=['初爻','二爻','三爻','四爻','五爻','上爻'];
  container.innerHTML='';
  for(let i=5;i>=0;i--){
    const row=document.createElement('div');
    row.className='yao-row'+(i<yaoResults.length?' active':'');
    const label=document.createElement('div');
    label.className='yao-label';
    label.textContent=labels[i];
    row.appendChild(label);
    const bar=document.createElement('div');
    bar.className='yao-bar';
    if(i<yaoResults.length){
      const yao=yaoResults[i];
      if(yao.symbol==='yang'){
        const seg=document.createElement('div');seg.className='yao-seg';seg.style.width='50px';bar.appendChild(seg);
      }else{
        const seg1=document.createElement('div');seg1.className='yao-seg broken';seg1.style.width='22px';bar.appendChild(seg1);
        const gap=document.createElement('div');gap.style.width='6px';bar.appendChild(gap);
        const seg2=document.createElement('div');seg2.className='yao-seg broken';seg2.style.width='22px';bar.appendChild(seg2);
      }
      // 动爻标记
      if(yao.type==='oldYang'||yao.type==='oldYin'){
        const mark=document.createElement('span');
        mark.style.cssText='font-size:10px;color:var(--gold);margin-left:4px';
        mark.textContent=yao.type==='oldYang'?'○':'✕';
        row.appendChild(mark);
      }
    }else{
      const seg=document.createElement('div');seg.className='yao-seg';seg.style.opacity='0.15';seg.style.width='50px';bar.appendChild(seg);
    }
    row.appendChild(bar);
    container.appendChild(row);
  }
}

function interpretHexagram(){
  // 从下到上排列六爻，构建卦象
  // 阳=1, 阴=0
  let binary='';
  for(let i=0;i<6;i++){
    binary+=(yaoResults[i].symbol==='yang')?'1':'0';
  }
  // 转换为卦序（上卦+下卦）
  // 下卦：初爻~三爻，上卦：四爻~上爻
  const lowerMap={'111':0,'110':1,'101':2,'100':3,'011':4,'010':5,'001':6,'000':7}; // 乾兑离震巽坎艮坤
  const lower=lowerMap[binary.slice(0,3)];
  const upper=lowerMap[binary.slice(3,6)];
  // 64卦索引 = 上卦*8 + 下卦
  const hexIdx=upper*8+lower;
  const hex=hexagrams[hexIdx];
  // 显示结果
  document.getElementById('hexName').textContent=hex.s+' '+hex.n;
  document.getElementById('hexSymbol').textContent=hex.d;
  document.getElementById('hexDesc').textContent='卦意：'+hex.m;
  const lvEl=document.getElementById('hexLevel');
  lvEl.textContent=hex.l;
  lvEl.className='divine-level '+(hex.l.includes('上上')?'upper':(hex.l.includes('上')?'mid':(hex.l.includes('下')?'lower':'mid')));
  // 动爻解
  let movingYao='';
  yaoResults.forEach((y,i)=>{
    if(y.type==='oldYang')movingYao+=(i+1)+'爻动(阳变阴)；';
    if(y.type==='oldYin')movingYao+=(i+1)+'爻动(阴变阳)；';
  });
  document.getElementById('hexMeaning').textContent=(movingYao?'变卦提示：'+movingYao+'\n':'')+'吉凶：'+hex.l+' ｜ 建议：'+hex.m;
  document.getElementById('coinResult').classList.add('show');
  document.getElementById('coinBtns').style.display='none';
  document.getElementById('coinAgainBtns').style.display='flex';
  showLotus();
  // 保存记录
  const d=gd();const divs=d.divinations||[];
  divs.unshift({type:'coin',hexagram:hex.n,symbol:hex.s,date:new Date().toLocaleDateString('zh-CN')});
  d.divinations=divs;sd(d);
}

function resetCoin(){
  coinTossCount=0;yaoResults=[];
  document.getElementById('coinResult').classList.remove('show');
  document.getElementById('coinAgainBtns').style.display='none';
  document.getElementById('coinBtns').style.display='flex';
  const btn=document.getElementById('btnTossCoin');
  btn.disabled=false;btn.textContent='摇 卦';
  document.getElementById('coinResultRow').innerHTML='';
  renderYaoLines();
  // 重置铜钱字
  document.getElementById('coin1').querySelector('.coin-char').textContent='乾';
  document.getElementById('coin2').querySelector('.coin-char').textContent='坤';
  document.getElementById('coin3').querySelector('.coin-char').textContent='易';
}
